name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    name: Selftest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile gx.py test_gx.py

      - name: Run gx selftest
        run: python gx.py selftest
